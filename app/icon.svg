<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- የወርቃማ ቢጫ የቀለም ሽግግር (Premium Gold Gradient) -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE000"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF7B00"/>
    </linearGradient>
    
    <!-- የጀርባ ጥቁር የቀለም ሽግግር (Sleek Dark Background) -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24292e"/>
      <stop offset="100%" stop-color="#0a0c0f"/>
    </linearGradient>

    <!-- የ 3D ጥላ (Drop Shadow) -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- ዘመናዊ አራት ማዕዘን (Squircle Background) ከስውር የብርሃን መስመር ጋር -->
  <rect width="512" height="512" rx="115" fill="url(#darkBg)"/>
  <rect width="512" height="512" rx="115" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.05"/>

  <!-- ግራ ክንፍ (ብርማ/ነጭ) - ጥንካሬን የሚያሳይ -->
  <path d="M120 160 L240 380 L300 380 L180 160 Z" fill="#ffffff" opacity="0.9" filter="url(#shadow)"/>
  
  <!-- ቀኝ ክንፍ (የሚያብረቀርቅ ወርቅ) - ከፍታን እና ማሸነፍን የሚያሳይ -->
  <path d="M400 130 L220 380 L280 380 L460 130 Z" fill="url(#goldGradient)" filter="url(#shadow)"/>
  
  <!-- የስፖርት/የፍጥነት መስመር (Speed Accent) -->
  <path d="M380 130 L400 130 L220 380 L200 380 Z" fill="#FF4500" opacity="0.8"/>
</svg>
